spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adminTest}
    username: ${SPRING_DATASOURCE_USERNAME:test}
    password: ${SPRING_DATASOURCE_PASSWORD:password1@}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8081
aag:
  crypto:
    keystore-path: ${AAG_KEYSTORE_PATH:config/aag-keystore.p12}
    keystore-password: ${AAG_KEYSTORE_PASSWORD:}
    key-alias: ${AAG_KEYSTORE_KEY_ALIAS:aag-secret-aes}
